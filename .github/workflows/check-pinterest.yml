name: Check Pinterest (read-only)
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect and list boards (posts nothing)
        env:
          PINTEREST_APP_ID: ${{ vars.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: |
          cd robot && python3 -c "
          import pinterest
          from common import http, bearer, PIN_API
          print('account:', http('GET', PIN_API + '/user_account', headers=bearer(pinterest._key())).get('username'))
          print('boards:', list(pinterest.boards()))"
