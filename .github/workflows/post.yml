name: Post
# Every 15 minutes: publishes anything in queue/*.json whose time has come. Run by hand with "dry run" to test (publishes nothing).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check and prepare everything, publish nothing"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Post what's due
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ vars.PINTEREST_APP_ID }}
          PINTEREST_ON: ${{ vars.PINTEREST_ON }}
          PAGE_ID: ${{ vars.PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          ROBOT_PAUSED: ${{ vars.ROBOT_PAUSED }}
        run: python3 robot/post.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Save the log
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git config user.name "Sparrow Street robot"
          git config user.email "sparrowstreetstories@users.noreply.github.com"
          git add log
          git diff --cached --quiet && exit 0
          git commit -m "Robot log $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
