name: Comment guard
# Every hour: hides (never deletes, never replies to) spam, links and unsafe comments on our latest posts.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check comments
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          PAGE_ID: ${{ vars.PAGE_ID }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          ROBOT_PAUSED: ${{ vars.ROBOT_PAUSED }}
        run: python3 robot/guard.py
      - name: Save the log
        if: always()
        run: |
          git config user.name "Sparrow Street robot"
          git config user.email "sparrowstreetstories@users.noreply.github.com"
          git add log
          git diff --cached --quiet && exit 0
          git commit -m "Guard log $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
